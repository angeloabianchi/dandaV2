<!-- hacer un request con AJAX a base de datos buscando un proyecto por nombre, 
y mostrar los resultados en la página sin recargarla. -->

{% extends 'home/home.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/project.css' %}">
{% endblock %}

{% block content %}

    <!-- Loader --> 
    <div id="video-loader"> 
        <p>Loading...</p> 
    </div>

    <!-- Contenido oculto inicialmente -->
    <div class="page-content" id="page-content">
        <h3>{{ project.display_name }}</h3>
        <p>{{ project.description }}</p>
        <div>
            <div id="vimeo-player" style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0;">
                <iframe 
                    id="vimeo-iframe"
                    src="https://player.vimeo.com/video/{{ project.video }}?badge=0&amp;autopause=0&amp;quality_selector=1&amp;player_id=0&amp;app_id=58479&amp;title=0&amp;byline=0&amp;portrait=0&amp;autoplay=1&amp;muted=1&amp;controls=0&amp;loop=1" 
                    frameborder="0" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen 
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                    title="{{ project.display_name }}"> 
                </iframe>
            </div>

        </div>
        <div>
            {% for image in images %}
                <div class="project-images">
                    <img src="{{ image.url }}" alt="{{ image.alt_text }}">
                </div>
            {% endfor %}
        </div>
    </div>


    <script src="https://player.vimeo.com/api/player.js"></script>

    <script>
        const iframe = document.getElementById('vimeo-iframe');

        const player = new Vimeo.Player(iframe);

        player.ready().then(function () {
            document.getElementById('video-loader').style.display = 'none'; 
            document.getElementById('page-content').classList.add('visible');
        });
    </script>
    
{% endblock %}
